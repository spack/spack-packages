# libclang detection when llvm-config reports a bindir without the derived clang
- layout:
  - executables:
    - "bin/clang-15"
    - "bin/clang++-15"
    script: |
      echo "clang version 15.0.7"
      echo "Target: x86_64-pc-linux-gnu"
      echo "Thread model: posix"
      echo "InstalledDir: /usr/bin"
  - executables:
    - "bin/llvm-config-15"
    script: |
      case "$1" in
        --version) echo "15.0.7" ;;
        --includedir|--libdir) echo "/tmp" ;;
        --bindir) echo "/does/not/exist" ;;
      esac
  platforms: ["darwin", "linux"]
  results:
  - spec: 'llvm@15.0.7 +clang~flang~libclang~lld~lldb'
    extra_attributes:
      compilers:
        c: ".*/bin/clang-15$"
        cxx: ".*/bin/clang[+][+]-15$"

# libclang detection when llvm-config itself fails during probing
- layout:
  - executables:
    - "bin/clang-14"
    - "bin/clang++-14"
    script: |
      echo "clang version 14.0.6"
      echo "Target: x86_64-pc-linux-gnu"
      echo "Thread model: posix"
      echo "InstalledDir: /usr/bin"
  - executables:
    - "bin/llvm-config-14"
    script: |
      case "$1" in
        --version) echo "14.0.6" ;;
        *) echo "intentional llvm-config libclang probe failure" >&2; exit 1 ;;
      esac
  platforms: ["darwin", "linux"]
  results:
  - spec: 'llvm@14.0.6 +clang~flang~libclang~lld~lldb'
    extra_attributes:
      compilers:
        c: ".*/bin/clang-14$"
        cxx: ".*/bin/clang[+][+]-14$"

# flang-new detection: flang-new generates slightly-different output than clang
- layout:
  - executables:
    - "bin/clang"
    - "bin/clang++"
    script: |
      for arg in "$@"; do
        case "$arg" in
          -o*)
            output="${arg#-o}"
            printf '#!/bin/bash\necho "OK: mock libclang"\n' > "$output"
            chmod +x "$output"
            exit 0
            ;;
        esac
      done
      echo "clang version 19.1.6 (https://github.com/spack/spack.git 8d3a733b7798b6e33c371518b6dec298c3ebd8b1)"
      echo "Target: x86_64-unknown-linux-gnu"
      echo "Thread model: posix"
      echo "InstalledDir: /path/to/spack/install/llvm/bin"
  - executables:
    - "bin/llvm-config"
    script: |
      case "$1" in
        --version) echo "19.1.6" ;;
        --includedir|--libdir) echo "/tmp" ;;
        --bindir) dirname "$0" ;;
      esac
  - executables:
    - "bin/flang-new"
    script: |
      echo "flang-new version 19.1.6 (https://github.com/spack/spack.git 8d3a733b7798b6e33c371518b6dec298c3ebd8b1)"
      echo "Target: x86_64-unknown-linux-gnu"
      echo "Thread model: posix"
      echo "InstalledDir: /path/to/spack/install/llvm/bin"
  platforms: ["darwin", "linux"]
  results:
  - spec: 'llvm@19.1.6 +flang+clang+libclang~lld~lldb'
    extra_attributes:
      compilers:
        c: ".*/bin/clang"
        cxx: ".*/bin/clang[+][+]"
        fortran: ".*/bin/flang-new"

