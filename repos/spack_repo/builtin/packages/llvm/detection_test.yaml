# Multiple LLVM packages in the same prefix
- layout:
  - executables:
    - "bin/clang-8"
    - "bin/clang++-8"
    script: |
      for arg in "$@"; do
        case "$arg" in
          -o*)
            output="${arg#-o}"
            printf '#!/bin/bash\necho "OK: mock libclang"\n' > "$output"
            chmod +x "$output"
            exit 0
            ;;
        esac
      done
      echo "clang version 8.0.0-3~ubuntu18.04.2 (tags/RELEASE_800/final)"
      echo "Target: x86_64-pc-linux-gnu"
      echo "Thread model: posix"
      echo "InstalledDir: /usr/bin"
  - executables:
    - "bin/llvm-config-8"
    script: |
      case "$1" in
        --version) echo "8.0.0" ;;
        --includedir|--libdir) echo "/tmp" ;;
        --bindir) dirname "$0" ;;
      esac
  - executables:
    - "bin/ld.lld-8"
    script: 'echo "LLD 8.0.0 (compatible with GNU linkers)"'
  - executables:
    - "bin/lldb"
    script: 'echo "lldb version 8.0.0"'
  - executables:
    - "bin/clang-3.9"
    - "bin/clang++-3.9"
    script: |
      for arg in "$@"; do
        case "$arg" in
          -o*)
            output="${arg#-o}"
            printf '#!/bin/bash\necho "OK: mock libclang"\n' > "$output"
            chmod +x "$output"
            exit 0
            ;;
        esac
      done
      echo "clang version 3.9.1-19ubuntu1 (tags/RELEASE_391/rc2)"
      echo "Target: x86_64-pc-linux-gnu"
      echo "Thread model: posix"
      echo "InstalledDir: /usr/bin"
  - executables:
    - "bin/llvm-config-3.9"
    script: |
      case "$1" in
        --version) echo "3.9.1" ;;
        --includedir|--libdir) echo "/tmp" ;;
        --bindir) dirname "$0" ;;
      esac
  platforms: ["darwin", "linux"]
  results:
  - spec: 'llvm@8.0.0+clang+libclang~flang+lld+lldb'
    extra_attributes:
      compilers:
        c: ".*/bin/clang-8$"
        cxx: ".*/bin/clang[+][+]-8$"

  - spec: 'llvm@3.9.1+clang+libclang~flang~lld~lldb'
    extra_attributes:
      compilers:
        c: ".*/bin/clang-3.9$"
        cxx: ".*/bin/clang[+][+]-3.9$"

# Apple Clang should not be detected
- layout:
  - executables:
    - "bin/clang"
    - "bin/clang++"
    script: |
      echo "Apple clang version 11.0.0 (clang-1100.0.33.8)"
      echo "Target: x86_64-apple-darwin19.5.0"
      echo "Thread model: posix"
      echo "InstalledDir: /Library/Developer/CommandLineTools/usr/bin"
  platforms: ["darwin"]
  results: []

# ATfL should not be detected as upstream LLVM
- layout:
  - executables:
    - "bin/clang"
    - "bin/clang++"
    script: |
      echo "Arm Toolchain for Linux 20.1 clang version 20.1.0"
      echo "Target: aarch64--linux-gnu"
      echo "Thread model: posix"
      echo "InstalledDir: /opt/arm/arm-toolchain-for-linux-20.1/bin"
  platforms: ["linux"]
  results: []
