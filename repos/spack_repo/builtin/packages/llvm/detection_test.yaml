paths:
- layout:
  - executables:
    - "bin/clang-3.9"
    - "bin/clang++-3.9"
    script: |
      for arg in "$@"; do
        case "$arg" in
          -o*)
            output="${arg#-o}"
            printf '#!/bin/bash\necho "OK: mock libclang"\n' > "$output"
            chmod +x "$output"
            exit 0
            ;;
        esac
      done
      echo "clang version 3.9.1-19ubuntu1 (tags/RELEASE_391/rc2)"
      echo "Target: x86_64-pc-linux-gnu"
      echo "Thread model: posix"
      echo "InstalledDir: /usr/bin"
  - executables:
    - "bin/llvm-config-3.9"
    script: |
      case "$1" in
        --version) echo "3.9.1" ;;
        --includedir|--libdir) echo "/tmp" ;;
        --bindir) dirname "$0" ;;
      esac
  platforms: ["darwin", "linux"]
  results:
  - spec: 'llvm@3.9.1 +clang+libclang~flang~lld~lldb'
    extra_attributes:
      compilers:
        c: ".*/bin/clang-3.9$"
        cxx: ".*/bin/clang[+][+]-3.9$"

# clang compiler detection without libclang build usability
- layout:
  - executables:
    - "bin/clang-18"
    - "bin/clang++-18"
    script: |
      for arg in "$@"; do
        case "$arg" in
          -o*)
            output="${arg#-o}"
            printf '#!/bin/bash\necho "intentional libclang probe run failure"\nexit 1\n' > "$output"
            chmod +x "$output"
            exit 0
            ;;
        esac
      done
      echo "clang version 18.1.3 (1ubuntu1)"
      echo "Target: x86_64-pc-linux-gnu"
      echo "Thread model: posix"
      echo "InstalledDir: /usr/bin"
  - executables:
    - "bin/llvm-config-18"
    script: |
      case "$1" in
        --version) echo "18.1.3" ;;
        --includedir|--libdir) echo "/tmp" ;;
        --bindir) dirname "$0" ;;
      esac
  platforms: ["darwin", "linux"]
  results:
  - spec: 'llvm@18.1.3 +clang~flang~libclang~lld~lldb'
    extra_attributes:
      compilers:
        c: ".*/bin/clang-18$"
        cxx: ".*/bin/clang[+][+]-18$"

# libclang detection when the mock clang compile fails
- layout:
  - executables:
    - "bin/clang-17"
    - "bin/clang++-17"
    script: |
      for arg in "$@"; do
        case "$arg" in
          -o*)
            echo "intentional libclang probe compile failure" >&2
            exit 1
            ;;
        esac
      done
      echo "clang version 17.0.6"
      echo "Target: x86_64-pc-linux-gnu"
      echo "Thread model: posix"
      echo "InstalledDir: /usr/bin"
  - executables:
    - "bin/llvm-config-17"
    script: |
      case "$1" in
        --version) echo "17.0.6" ;;
        --includedir|--libdir) echo "/tmp" ;;
        --bindir) dirname "$0" ;;
      esac
  platforms: ["darwin", "linux"]
  results:
  - spec: 'llvm@17.0.6 +clang~flang~libclang~lld~lldb'
    extra_attributes:
      compilers:
        c: ".*/bin/clang-17$"
        cxx: ".*/bin/clang[+][+]-17$"

