#
# This packages config is used to describe the core runtimes to reuse in
# the common stacks from the "base" stack.
#
# Maintainers:
# - kwryankrattiger
packages:
  lapack:
    prefer:
      - openblas
  blas:
    prefer:
      - openblas
  scalapck:
    prefer:
      - netlib-scalapack
  mpi:
    prefer:
      - mpich

  tbb:
    require:
      - intel-oneapi-tbb
