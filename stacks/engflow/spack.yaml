# Windows Visualization Stack
# maintainers:
# - John Parent (@johnwparent)
# - Ryan Krattiger (@kwryankrattiger)

spack:
  view: false
  include:
  - ../../.ci/gitlab/

  specs:
  - "tipi-paraview"

  ci:
    pipeline-gen:
    - build-job:
        image: { name: "tipibuild/linux-kitware-paraview@sha256:e0417824c4d417eb4d363f08954d11b94f9e6eb4ec76cee391db72e1e281fb18", entrypoint: ["/bin/sh", "-c"]}
        before_script:
        - mkdir -p /usr/local/share/.tipi/environments/generalized/v1/
        - mkdir -p /usr/local/share/.tipi/vT.w/


  cdash:
    build-group: "Cmake-re test"
