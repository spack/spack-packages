spack:
  view: false

  include:
  - ../../.ci/gitlab/

  packages:
    all:
      require:
      - target=aarch64
      - +mpi
    blas:
      require:
      - openblas
    mpi:
      require:
      - openmpi

  specs:
  - ascent
  - blt
  - caliper
  - camp
  - chai
  - mfem
  - mfem +superlu-dist+petsc+sundials
  - raja
  - umpire

  cdash:
    build-group: RADIUSS Packages on ARM64
