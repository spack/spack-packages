ci:
  broken-tests-packages:
  - mpich
  - openmpi
  - py-mpi4py
  pipeline-gen:
  - any-job:
      variables:
        GIT_STRATEGY: "empty"
  - match_behavior: first
    submapping:
    - match:
      - bazel
      - llvm
      - py-jaxlib
      - py-tensorflow
      - py-torch
      - rust
      build-job:
        tags: [ "huge" ]
  - build-job-remove:
      tags: [spack]
  - build-job:
      timeout: 240 minutes
      tags: [ "macos-tahoe", "apple-clang-17", "aarch64-macos" ]
      before_script:
      - export SPACK_GNUPGHOME="${CI_PROJECT_DIR}/.gpg"
      - mkdir "${SPACK_GNUPGHOME}"
  - build-job-remove:
      image:: macos-run-on-metal
