stages: [ "generate", "build" ]

include:
  - ./workflow/rules.yml
  ###############################################
  # Spack Project Stacks
  - component: ./workflow/stack-job.yml
    inputs:
      name: tutorial
      os:  linux
      target: x86_64_v3
  - component: ./workflow/stack-job.yml
    inputs:
      name: build-systems
      os:  linux
      target: x86_64_v3
  - component: ./workflow/stack-job.yml
    inputs:
      name: bootstrap-x86_64_v3-linux-gnu
      os:  linux
      target: x86_64_v3
  - component: ./workflow/stack-job.yml
    inputs:
      name: bootstrap-aarch64-darwin
      os: darwin
      target: aarch64
  - component: ./workflow/stack-job.yml
    inputs:
      name: developer-bootstrap-x86_64_v3-linux-gnu
      os:  linux
      target: x86_64_v3
  - component: ./workflow/stack-job.yml
    inputs:
      name: developer-bootstrap-aarch64-linux-gnu
      os:  linux
      target: aarch64
  - component: ./workflow/stack-job.yml
    inputs:
      name: developer-bootstrap-darwin
      os: darwin
      target: aarch64
  ###############################################
  # E4S
  - component: ./workflow/stack-job.yml
    inputs:
      name: e4s 
      os:  linux
      target: x86_64_v3
  - component: ./workflow/stack-job.yml
    inputs:
      name: e4s-neoverse-v2
      os:  linux
      target: neoverse-v2
  - component: ./workflow/stack-job.yml
    inputs:
      name: e4s-rocm-external
      os:  linux
      target: x86_64_v3
  - component: ./workflow/stack-job.yml
    inputs:
      name: e4s-oneapi
      os:  linux
      target: x86_64_v3
  - component: ./workflow/stack-job.yml
    inputs:
      name: e4s-cray-rhel
      os: cray-rhel
      target: x86_64_v3
  - component: ./workflow/stack-job.yml
    inputs:
      name: e4s-cray-sles
      os: cray-rhel
      target: zen4
  ###############################################
  # DOE Stacks
  - component: ./workflow/stack-job.yml
    inputs:
      name: radiuus
      os:  linux
      target: x86_64_v3 
  - component: ./workflow/stack-job.yml
    inputs:
      name: radiuus-aarch64
      os:  linux
      target: aarch64
  - component: ./workflow/stack-job.yml
    inputs:
      name: data-vis-sdk
      os:  linux
      target: x86_64_v3
  - component: ./workflow/stack-job.yml
    inputs:
      name: tools-sdk
      os:  linux
      target: x86_64_v3
  - component: ./workflow/stack-job.yml
    inputs:
      name: windows-vis
      os: windows
      target: x86_64_v3
  ###############################################
  # Developer tools
  - component: ./workflow/stack-job.yml
    inputs:
      name: developer-tools-x86_64_v3-linux-gnu
      os:  linux
      target: x86_64_v3
  - component: ./workflow/stack-job.yml
    inputs:
      name: developer-tools-aarch64-linux-gnu
      os:  linux
      target: aarch64
  - component: ./workflow/stack-job.yml
    inputs:
      name: developer-tools-darwin
      os: darwin
      target: aarch64
  ###############################################
  # Machine Learning
  - component: ./workflow/stack-job.yml
    inputs:
      name: ml-linux-x86_64
      os:  linux
      target: x86_64_v4
  - component: ./workflow/stack-job.yml
    inputs:
      name: ml-linux-aarch64
      os:  linux
      target: aarch64
  - component: ./workflow/stack-job.yml
    inputs:
      name: ml-darwin-aarch64
      os: darwin
      target: aarch64
  ###############################################
  # HEP
  - component: ./workflow/stack-job.yml
    inputs:
      name: hep
      os: linux 
      target: x86_64_v3

default:
  image: { "name": "ghcr.io/spack/e4s-ubuntu-18.04:v2021-10-18", "entrypoint": [""] }

#####################################################
# Setup jobs to ensure correct status reporting
#####################################################
dotenv:
  stage: .pre
  variables:
    CI_OIDC_REQUIRED: 0
    KUBERNETES_CPU_REQUEST: "100m"
    KUBERNETES_MEMORY_REQUEST: "5M"
  artifacts:
    reports:
      dotenv: env
  tags: [ "spack", "service" ]
  script:
  - export WRITE_DOTENV_SCRIPT_REF="0f92f8bcd4dd94fc7379eef8db5c9ed6f1935402"
  - export WRITE_DOTENV_SCRIPT_SHA256="124d80ef595b9ddc2fca3f202a70ee15378547ad5e887fe7d3b248669c5ee54a"
  - curl -LSsO https://raw.githubusercontent.com/spack/spack-packages/$WRITE_DOTENV_SCRIPT_REF/.ci/gitlab/scripts/common/write_dotenv.py
  - echo "$WRITE_DOTENV_SCRIPT_SHA256  write_dotenv.py" | sha256sum -c
  - python3 write_dotenv.py .ci/env
  - cat env

force_pipeline_status:
  extends: [.status_job_rules]
  stage: generate
  tags: ["spack", "service_noop"]
  retry: 0
  allow_failure: true
  image: busybox@sha256:37f7b378a29ceb4c551b1b5582e27747b855bbfaa73fa11914fe0df028dc581f
  variables:
    CI_OIDC_REQUIRED: 0
    GIT_STRATEGY: "none"
    CI_JOB_SIZE: "small"
    KUBERNETES_CPU_REQUEST: "100m"
    KUBERNETES_MEMORY_REQUEST: "5M"
  script:
  - echo "This job is a placeholder job to ensure a pipeline status is posted even if no jobs are run"
