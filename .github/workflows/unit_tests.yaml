name: unit tests

on:
  # Allows act's default push event to select this workflow locally. The job
  # guards below prevent this local-only trigger from running tests on GitHub.
  push:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: unit_tests-${{github.ref}}-${{github.event.pull_request.number || github.run_number}}
  cancel-in-progress: true

jobs:
  # Run unit tests with different configurations on linux
  ubuntu:
    # Run act's synthetic push, or GitHub's workflow_call/dispatch events, but
    # skip ordinary GitHub push events introduced only for act compatibility.
    if: ${{ github.actor == 'nektos/act' || github.event_name != 'push' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
        on_develop:
        - ${{ github.ref == 'refs/heads/develop' }}
        include:
        - python-version: '3.7'
          os: ubuntu-22.04
          on_develop: ${{ github.ref == 'refs/heads/develop' }}
        exclude:
        - python-version: '3.8'
          os: ubuntu-latest
          on_develop: false
        - python-version: '3.9'
          os: ubuntu-latest
          on_develop: false
        - python-version: '3.10'
          os: ubuntu-latest
          on_develop: false
        - python-version: '3.11'
          os: ubuntu-latest
          on_develop: false

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      # In local workflow runs using act, setup-python is not supported and not needed
      if: ${{ github.actor != 'nektos/act' }}
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install System packages
      run: |
          sudo apt-get -y update
          # Needed for unit tests
          sudo apt-get -y install \
              coreutils cvs gfortran graphviz gnupg2 mercurial ninja-build \
              cmake bison libbison-dev subversion
    - name: Install Python packages
      run: pip install --upgrade pytest clingo
    - uses: ./.github/actions/checkout-spack
    - name: Run unit tests
      run: PYTHONPATH="$PWD/spack-core/lib/spack" python3 -m pytest -v --exitfirst

  # Run unit tests on MacOS
  macos:
    # Keep the same event guard as the Linux matrix; act skips this platform.
    if: ${{ github.actor == 'nektos/act' || github.event_name != 'push' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["macos-15", "macos-15-intel"]
        python-version: ["3.11"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Python packages
      run: pip install --upgrade pytest clingo
    - name: Setup Homebrew packages
      run: brew install dash fish gcc gnupg
    - uses: ./.github/actions/checkout-spack
    - name: Run unit tests
      run: PYTHONPATH="$PWD/spack-core/lib/spack" python3 -m pytest -v --exitfirst

  # Run unit tests on Windows
  windows:
    # Keep the same event guard as the Linux matrix; act skips this platform.
    if: ${{ github.actor == 'nektos/act' || github.event_name != 'push' }}
    defaults:
      run:
        shell:
          powershell Invoke-Expression -Command "./.ci/windows_test_setup.ps1"; {0}
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: 3.9
    - name: Install Python packages
      run: python -m pip install --upgrade pywin32 pytest clingo
    #- name: Create local develop
    #  run: |
    #    ./.github/workflows/bin/setup_git.ps1
    - uses: ./.github/actions/checkout-spack
    - name: Run unit tests
      run: |
        $Env:PYTHONPATH = "$Env:SPACK_ROOT\lib\spack;$Env:PYTHONPATH"
        python3 -m pytest -v --exitfirst
        ./.ci/validate_last_exit.ps1
