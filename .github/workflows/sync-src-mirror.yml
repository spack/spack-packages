name: sync-src-mirror

# Nightly backfill of the source mirror: finds version tarballs, resources,
# and patches missing from the mirror (e.g. because update-src-mirror failed
# or a fetch was flaky) and mirrors them. URLs and checksums are all known
# statically from package.py files, so nothing here concretizes.

on:
  schedule:
    - cron: '0 3 * * *'  # nightly at 03:00 UTC
  workflow_dispatch:

permissions:
  id-token: write  # Required for AWS OIDC authentication
  contents: read

jobs:
  sync-mirror:
    if: github.repository == 'spack/spack-packages'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Checkout Spack
        uses: ./.github/actions/checkout-spack
        with:
          fetch-depth: 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get digests already in the mirror
        run: |
          # Tarballs are content addressed as _source-cache/archive/<xx>/<sha256>.<ext>.
          # Thus a single recursive listing of the archive/ prefix is a complete list
          # of mirrored versions, patches, and package resources. Use awk and sed to strip
          # out the shas from the filenames and save the shas to a file for later use.
          aws s3 ls --recursive "s3://${{ secrets.S3_BUCKET_NAME }}/_source-cache/archive/" \
            | awk '{print $4}' \
            | sed -e 's|.*/||' -e 's|\..*||' \
            | sort -u > mirrored-shas.txt
          echo "$(wc -l < mirrored-shas.txt) shas in the mirror"

      - name: Find artifacts in repository missing from mirror
        id: find-missing
        run: |
          source spack-core/share/spack/setup-env.sh

          spack python .github/workflows/bin/find-missing-mirror-artifacts.py \
            mirrored-shas.txt > missing-artifacts.tsv

          if [ ! -s missing-artifacts.tsv ]; then
            echo "Mirror is up to date"
            echo "missing=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "$(wc -l < missing-artifacts.tsv) artifacts missing from the mirror:"
          cut -f2 missing-artifacts.tsv
          echo "missing=true" >> $GITHUB_OUTPUT

      - name: Download, verify, and upload missing artifacts
        if: steps.find-missing.outputs.missing == 'true'
        run: |
          # Each line is: <sha256> TAB <mirror path> TAB <url> [TAB <url>...].
          # Download with curl (same flags spack uses: -f -L -sS), verify the
          # sha256, and upload each artifact individually so disk usage stays
          # bounded. Individual fetch failures (dead upstream URLs etc.) are
          # tolerated; they will simply be retried on the next nightly run.
          uploaded=0
          failed=0
          mkdir -p artifact-tmp

          while IFS=$'\t' read -r sha path url_list; do
            file="artifact-tmp/${path##*/}"
            ok=false

            while IFS= read -r url; do
              rm -f "$file"
              if curl -fLsS --retry 2 --connect-timeout 30 --max-time 1800 \
                   -o "$file" "$url"; then
                if echo "$sha  $file" | sha256sum --check --quiet -; then
                  ok=true
                  break
                fi
                echo "checksum mismatch for $url"
              else
                echo "failed to fetch $url"
              fi
            done < <(tr '\t' '\n' <<< "$url_list")

            if $ok; then
              aws s3 cp "$file" "s3://${{ secrets.S3_BUCKET_NAME }}/$path" \
                --no-overwrite --no-progress
              uploaded=$((uploaded + 1))
            else
              echo "could not mirror $path"
              failed=$((failed + 1))
            fi
            rm -f "$file"
          done < missing-artifacts.tsv

          echo "Uploaded $uploaded artifacts to the mirror; $failed failed"
